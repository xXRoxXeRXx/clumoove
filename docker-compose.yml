services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres-db:
    container_name: clumoove-postgres
    image: postgres:15-alpine
    restart: always
    # Internal only; do not publish a host port.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"]
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: cloud_migration_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - clumoove-network

  # ── Redis Queue ─────────────────────────────────────────────────────────────
  redis-queue:
    container_name: clumoove-redis
    image: redis:7-alpine
    restart: always
    # Internal only; REDIS_PASSWORD must be a strong deployment-specific secret.
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}" --bind 0.0.0.0
    volumes:
      - redis_data:/data
    networks:
      - clumoove-network

  # ── API Gateway ─────────────────────────────────────────────────────────────
  api-backend:
    container_name: clumoove-api
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    restart: always
    ports:
      - "8001:8000"
    environment:
      # Database & Queue Connections
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres-db:5432/cloud_migration_db?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-queue:6379
      - PORT=8000

      # Security & Keys
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN:-}

      # Security & Reverse Proxy
      - TRUSTED_PROXY=${TRUSTED_PROXY:-0}
      - MIGRATION_BLOCK_PRIVATE=${MIGRATION_BLOCK_PRIVATE:-0}

      # Mailer & Frontend
      - FRONTEND_URL=${FRONTEND_URL:-}

      # Performance & Timeouts
      - INDEXING_TIMEOUT_MINUTES=${INDEXING_TIMEOUT_MINUTES:-60}
      - WEBDAV_LISTING_TIMEOUT_SECONDS=${WEBDAV_LISTING_TIMEOUT_SECONDS:-120}

      # Structured Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_ENVIRONMENT=${LOG_ENVIRONMENT:-}
      - INSTANCE_ID=${INSTANCE_ID:-}
      - LOCAL_STORAGE_ROOT=/clumoove
    volumes:
      - ${LOCAL_STORAGE_HOST_PATH:-./local-storage}:/clumoove
    depends_on:
      - postgres-db
      - redis-queue
    networks:
      - clumoove-network

  # ── Migration Worker ────────────────────────────────────────────────────────
  migration-worker:
    container_name: clumoove-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    restart: always
    command: ["/app/worker"]
    environment:
      # Database & Queue Connections
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres-db:5432/cloud_migration_db?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-queue:6379

      # Security & Workers
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - MAX_THREADS=${MAX_THREADS:-50}
      - MAX_BACKUP_PACK_WRITERS=${MAX_BACKUP_PACK_WRITERS:-1}
      - MAX_RESTORE_PACK_READERS=${MAX_RESTORE_PACK_READERS:-1}
      - WEBDAV_LISTING_TIMEOUT_SECONDS=${WEBDAV_LISTING_TIMEOUT_SECONDS:-120}

      # Structured Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_ENVIRONMENT=${LOG_ENVIRONMENT:-}
      - INSTANCE_ID=${INSTANCE_ID:-}

      # Local Storage Sandbox
      - LOCAL_STORAGE_ROOT=/clumoove
    volumes:
      - ${LOCAL_STORAGE_HOST_PATH:-./local-storage}:/clumoove
    depends_on:
      - postgres-db
      - redis-queue
    networks:
      - clumoove-network

  # ── Web Frontend ────────────────────────────────────────────────────────────
  frontend:
    container_name: clumoove-frontend
    build:
      context: ./frontend
      target: prod
    restart: always
    ports:
      - "3001:3000"
    environment:
      # Read by nginx at container startup, not by Vite during image build.
      # Leave empty for a same-origin API proxy.
      - CLUMOOVE_API_URL=${CLUMOOVE_API_URL:-}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - api-backend
    networks:
      - clumoove-network

networks:
  clumoove-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
