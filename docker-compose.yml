networks:
  clumoove-network:
    driver: bridge

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: clumoove-postgres
    restart: always
    # Internal only; do not publish a host port.
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: cloud_migration_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"]
    networks:
      - clumoove-network

  redis-queue:
    image: redis:7-alpine
    container_name: clumoove-redis
    restart: always
    # Internal only; REDIS_PASSWORD must be a strong deployment-specific secret.
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}" --bind 0.0.0.0
    volumes:
      - redis_data:/data
    networks:
      - clumoove-network

  api-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    container_name: clumoove-api
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres-db:5432/cloud_migration_db?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-queue:6379
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN:-}
      - PORT=8000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_PHOTOS_CLIENT_ID=${GOOGLE_PHOTOS_CLIENT_ID:-}
      - GOOGLE_PHOTOS_CLIENT_SECRET=${GOOGLE_PHOTOS_CLIENT_SECRET:-}
      - DROPBOX_CLIENT_ID=${DROPBOX_CLIENT_ID:-}
      - DROPBOX_CLIENT_SECRET=${DROPBOX_CLIENT_SECRET:-}
      - HIDRIVE_CLIENT_ID=${HIDRIVE_CLIENT_ID:-}
      - HIDRIVE_CLIENT_SECRET=${HIDRIVE_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Clumoove}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-starttls}
      - INDEXING_TIMEOUT_MINUTES=${INDEXING_TIMEOUT_MINUTES:-60}
      - LOCAL_STORAGE_ROOT=/clumoove
    volumes:
      - ${LOCAL_STORAGE_HOST_PATH:-./local-storage}:/clumoove
    depends_on:
      - postgres-db
      - redis-queue
    networks:
      - clumoove-network

  migration-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    container_name: clumoove-worker
    restart: always
    command: ["/app/worker"]
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres-db:5432/cloud_migration_db?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-queue:6379
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - MAX_THREADS=${MAX_THREADS:-50}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_PHOTOS_CLIENT_ID=${GOOGLE_PHOTOS_CLIENT_ID:-}
      - GOOGLE_PHOTOS_CLIENT_SECRET=${GOOGLE_PHOTOS_CLIENT_SECRET:-}
      - DROPBOX_CLIENT_ID=${DROPBOX_CLIENT_ID:-}
      - DROPBOX_CLIENT_SECRET=${DROPBOX_CLIENT_SECRET:-}
      - HIDRIVE_CLIENT_ID=${HIDRIVE_CLIENT_ID:-}
      - HIDRIVE_CLIENT_SECRET=${HIDRIVE_CLIENT_SECRET:-}
      - LOCAL_STORAGE_ROOT=/clumoove
    volumes:
      - ${LOCAL_STORAGE_HOST_PATH:-./local-storage}:/clumoove
    depends_on:
      - postgres-db
      - redis-queue
    networks:
      - clumoove-network

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: clumoove-frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=http://localhost:8001
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - api-backend
    networks:
      - clumoove-network

volumes:
  postgres_data:
  redis_data:
