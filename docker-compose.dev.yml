services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres-db:
    container_name: clumoove-postgres-dev
    image: postgres:15-alpine
    restart: unless-stopped
    # Internal only; do not publish a host port.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"]
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: cloud_migration_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - clumoove-network

  # ── Redis Queue ─────────────────────────────────────────────────────────────
  redis-queue:
    container_name: clumoove-redis-dev
    image: redis:7-alpine
    restart: unless-stopped
    # Internal only; REDIS_PASSWORD must be a strong deployment-specific secret.
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}" --bind 0.0.0.0
    volumes:
      - redis_data:/data
    networks:
      - clumoove-network

  # ── API Gateway (Dev Live Reload via Air) ───────────────────────────────────
  api-backend:
    container_name: clumoove-api-dev
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["air", "-c", "/app/backend/.air.api.toml"]
    ports:
      - "8001:8000"
    environment:
      # Database & Queue Connections
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres-db:5432/cloud_migration_db?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-queue:6379
      - PORT=8000

      # Security & Keys
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN:-}

      # Security & Reverse Proxy
      - TRUSTED_PROXY=${TRUSTED_PROXY:-0}
      - MIGRATION_BLOCK_PRIVATE=${MIGRATION_BLOCK_PRIVATE:-0}

      # Performance & Logging
      - WEBDAV_LISTING_TIMEOUT_SECONDS=${WEBDAV_LISTING_TIMEOUT_SECONDS:-120}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_ENVIRONMENT=${LOG_ENVIRONMENT:-}
      - INSTANCE_ID=${INSTANCE_ID:-}

      # Local Storage Sandbox
      - LOCAL_STORAGE_ROOT=/clumoove
    volumes:
      - ./backend:/app/backend
      - ./frontend/src/locales:/app/frontend/src/locales:ro
      - ${LOCAL_STORAGE_HOST_PATH:-./local-storage}:/clumoove
    depends_on:
      - postgres-db
      - redis-queue
    networks:
      - clumoove-network

  # ── Migration Worker (Dev Live Reload via Air) ──────────────────────────────
  migration-worker:
    container_name: clumoove-worker-dev
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["air", "-c", "/app/backend/.air.worker.toml"]
    environment:
      # Database & Queue Connections
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres-db:5432/cloud_migration_db?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-queue:6379

      # Security & Workers
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - MAX_THREADS=${MAX_THREADS:-16}
      - MAX_BACKUP_PACK_WRITERS=${MAX_BACKUP_PACK_WRITERS:-1}
      - MAX_RESTORE_PACK_READERS=${MAX_RESTORE_PACK_READERS:-1}
      - WEBDAV_LISTING_TIMEOUT_SECONDS=${WEBDAV_LISTING_TIMEOUT_SECONDS:-120}

      # Structured Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_ENVIRONMENT=${LOG_ENVIRONMENT:-}
      - INSTANCE_ID=${INSTANCE_ID:-}

      # Local Storage Sandbox
      - LOCAL_STORAGE_ROOT=/clumoove
    volumes:
      - ./backend:/app/backend
      - ./frontend/src/locales:/app/frontend/src/locales:ro
      - ${LOCAL_STORAGE_HOST_PATH:-./local-storage}:/clumoove
    depends_on:
      - postgres-db
      - redis-queue
    networks:
      - clumoove-network

  # ── Web Frontend (Dev Server with HMR) ──────────────────────────────────────
  frontend:
    container_name: clumoove-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    command: node node_modules/vite/bin/vite.js --host --port 3000
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=http://localhost:8001
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - api-backend
    networks:
      - clumoove-network

networks:
  clumoove-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
