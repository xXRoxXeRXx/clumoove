name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# CI only reads the checked-out repository and dependency metadata.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Test
        run: go test ./...
      - name: Check table-scoped canonical schema DDL coverage
        run: go test ./internal/db -run TestCanonicalSchemaColumnsAppearInInitDB -count=1
      - name: Storage race check
        run: go test -race ./internal/storage
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit --project tsconfig.app.json
      - name: Lint
        run: npm run lint
