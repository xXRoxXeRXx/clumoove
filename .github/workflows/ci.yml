name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# CI only reads the checked-out repository and dependency metadata.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    # PostgreSQL for the OAuth token sink contract only; `go test ./...` below
    # runs without DATABASE_URL, so the other DB-backed tests keep skipping.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clumoove_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Test
        run: go test ./...
      - name: OAuth token sink contract (PostgreSQL)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/clumoove_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/db -run 'TestOAuthTokenSinkContract|TestOAuthReauthSinkReplacesTokensUnconditionally' -count=1 -v | tee sink-contract.log
          # The contract skips without a database; a skip here would be a silent pass.
          if grep -q -- '--- SKIP' sink-contract.log; then echo "sink contract was skipped" >&2; exit 1; fi
      - name: Check table-scoped canonical schema DDL coverage
        run: go test ./internal/db -run TestCanonicalSchemaColumnsAppearInInitDB -count=1
      - name: Storage race check
        run: go test -race ./internal/storage
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit --project tsconfig.app.json
      - name: Lint
        run: npm run lint
