root = "/app"
tmp_dir = "/tmp/air-worker"

[build]
  cmd = "cd /app/backend && go generate ./internal/i18n && go build -o /tmp/air-worker ./cmd/worker"
  bin = "/tmp/air-worker"
  include_dir = ["backend", "frontend/src/locales"]
  include_ext = ["go", "json"]
  exclude_dir = ["backend/tmp", "backend/vendor", "frontend/node_modules", "frontend/dist"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true

[misc]
  clean_on_exit = true
