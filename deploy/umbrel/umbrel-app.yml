id: clumoove
category: files
name: Clumoove
version: 0.15.0
tagline: Self-hosted cloud data migration & sync manager
description: >-
  Clumoove is a self-hosted cloud data migration and sync engine for files, calendars, and contacts.
  Easily connect and sync data between cloud providers including Nextcloud, Google Drive, Dropbox, OneDrive, HiDrive, S3, WebDAV, SMB, SFTP, FTP, Immich, Seafile, and local storage.
  Features include zero-disk streaming transfers, multi-threaded background migrations, cron schedules, conflict resolution, multi-channel notifications (Email, Telegram, Discord, Gotify, ntfy), and audit logging.
