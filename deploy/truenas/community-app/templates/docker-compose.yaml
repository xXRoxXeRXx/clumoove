{% set tpl = ix_lib.base.render.Render(values) %}

{% set net = tpl.networks.create_internal("clumoove-net") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{# ── PostgreSQL ───────────────────────────────────────────────────────────── #}
{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.clumoove.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, "postgres_15_image", pg_config, perm_container) %}
{% do postgres.container.add_network(net) %}

{# ── Redis ────────────────────────────────────────────────────────────────── #}
{% set redis_config = {
  "password": values.clumoove.redis_password,
  "volume": values.storage.redis_data,
} %}
{% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perm_container) %}
{% do redis.container.add_network(net) %}

{# ── API Gateway ─────────────────────────────────────────────────────────── #}
{% set api = tpl.add_container(values.consts.api_container_name, "api_image") %}
{% do api.add_network(net) %}
{% do api.add_dependency(values.consts.postgres_container_name) %}
{% do api.add_dependency(values.consts.redis_container_name) %}
{% do api.set_user(values.run_as.user, values.run_as.group) %}
{% do api.add_env("TZ", values.TZ) %}
{% do api.add_env("DATABASE_URL", "postgres://" + values.consts.db_user + ":" + values.clumoove.db_password + "@" + values.consts.postgres_container_name + ":5432/" + values.consts.db_name + "?sslmode=disable") %}
{% do api.add_env("REDIS_URL", "redis://:" + values.clumoove.redis_password + "@" + values.consts.redis_container_name + ":6379") %}
{% do api.add_env("PORT", "8000") %}
{% do api.add_env("ENCRYPTION_SECRET_KEY", values.clumoove.encryption_secret_key) %}
{% do api.add_env("JWT_SECRET_KEY", values.clumoove.jwt_secret_key) %}
{% do api.add_env("TRUSTED_PROXY", "1") %}
{% do api.add_env("LOCAL_STORAGE_ROOT", "/clumoove") %}
{% do api.add_storage(values.storage.local_storage, "/clumoove") %}

{% for env in values.clumoove.additional_envs %}
  {% do api.add_env(env.name, env.value) %}
{% endfor %}

{# ── Migration Worker ────────────────────────────────────────────────────── #}
{% set worker = tpl.add_container(values.consts.worker_container_name, "worker_image") %}
{% do worker.add_network(net) %}
{% do worker.set_command(["/app/worker"]) %}
{% do worker.add_dependency(values.consts.postgres_container_name) %}
{% do worker.add_dependency(values.consts.redis_container_name) %}
{% do worker.set_user(values.run_as.user, values.run_as.group) %}
{% do worker.add_env("TZ", values.TZ) %}
{% do worker.add_env("DATABASE_URL", "postgres://" + values.consts.db_user + ":" + values.clumoove.db_password + "@" + values.consts.postgres_container_name + ":5432/" + values.consts.db_name + "?sslmode=disable") %}
{% do worker.add_env("REDIS_URL", "redis://:" + values.clumoove.redis_password + "@" + values.consts.redis_container_name + ":6379") %}
{% do worker.add_env("ENCRYPTION_SECRET_KEY", values.clumoove.encryption_secret_key) %}
{% do worker.add_env("LOCAL_STORAGE_ROOT", "/clumoove") %}
{% do worker.add_storage(values.storage.local_storage, "/clumoove") %}

{# ── Web Frontend & Portal ───────────────────────────────────────────────── #}
{% set frontend = tpl.add_container(values.consts.frontend_container_name, "frontend_image") %}
{% do frontend.add_network(net) %}
{% do frontend.add_dependency(values.consts.api_container_name) %}
{% do frontend.add_env("TZ", values.TZ) %}
{% do frontend.add_env("CLUMOOVE_API_URL", "") %}
{% do frontend.add_port(values.network.web_port, 3000) %}

{% do tpl.portals.add(values.network.web_port, scheme="http", path="/") %}

{{ tpl.render() }}
